<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhenium logo options</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font-family:var(--font-sans,system-ui,sans-serif);line-height:1.5}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--foreground,#eee);outline-offset:5px}::selection{background:#80B5A0;color:#142726}h2,h3,p{margin:0}h2{font-size:24px;letter-spacing:-.02em;line-height:1.2}p{color:var(--muted-foreground,#aaa);font-size:14px}.tools{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}.switches{display:flex;align-items:center;gap:8px}.switches button{background:transparent;border:1px solid var(--border,#555);border-radius:8px;padding:5px 11px;font-size:13px}.switches button[aria-pressed=true]{background:var(--foreground,#eee);color:var(--background,#171717);border-color:transparent}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}.choice{display:block;border:0;background:none;padding:0;text-align:left;min-width:0}.stage{--one-ink:#DCEBDC;background:#142726;color:#F3EFE7;border-radius:12px}.choice .stage{height:172px;display:grid;place-items:center;border:2px solid transparent;transition:border-color .15s ease}.choice[aria-pressed=true] .stage{border-color:var(--foreground,#eee)}.choice .art{width:146px;max-width:94%}.art svg{display:block;width:100%;height:auto}.caption{display:block;margin-top:12px;font-size:14px;font-weight:600;line-height:1.35}.subcaption{display:block;color:var(--muted-foreground,#aaa);font-size:12px;font-weight:400;margin-top:3px}.preview{display:flex;gap:22px;align-items:center;justify-content:center;padding:26px 20px;min-height:180px}.preview .art{width:126px;flex-shrink:0}.wordmark{font-size:34px;font-weight:650;line-height:1.1;letter-spacing:-.025em}.tagline{font-size:13px;color:#D0DFD8;margin-top:9px}.explanation{margin-top:16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}.explanation strong{font-size:16px}.note{margin-top:4px;max-width:65ch}.checks{display:flex;gap:20px;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--border,#444)}.checks p{font-size:12px;margin-right:auto}.mini{width:40px;height:40px;padding:4px;border-radius:8px;flex-shrink:0}.mini .art{width:32px;height:32px}.mono .art svg [fill]:not([fill="white"]):not([fill="black"]){fill:var(--one-ink)}.light .stage{--one-ink:#19362E;background:#F3EFE7;color:#19362E}.light .tagline{color:#426157}.light .preview{box-shadow:inset 0 0 0 1px #D6DED5}.foot{margin-top:14px;font-size:12px}a{color:inherit;text-underline-offset:3px}
@media(max-width:500px){.choices{gap:10px}.choice .stage{height:118px}.choice .art{width:108px}.caption{font-size:12px}.subcaption{font-size:11px}.preview{gap:10px;padding:22px 16px;min-height:160px}.preview .art{width:100px}.wordmark{font-size:28px}.tagline{font-size:11px;max-width:150px}.explanation{flex-wrap:wrap}.checks{gap:12px}.tools{margin-bottom:18px}.switches{gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tools"><h2>Rhenium</h2><div class="switches" aria-label="Preview appearance"><button id="dark" type="button" aria-pressed="true">Dark</button><button id="light" type="button" aria-pressed="false">Light</button><button id="mono" type="button" aria-pressed="false">One color</button></div></div>
<div class="choices" role="group" aria-label="Choose a logo to preview">
<button class="choice" data-key="a" aria-pressed="true"><span class="stage"><span class="art" id="art-a"></span></span><span class="caption">A · Mint Orbit</span><span class="subcaption">Closest to our app</span></button>
<button class="choice" data-key="b" aria-pressed="false"><span class="stage"><span class="art" id="art-b"></span></span><span class="caption">B · Silver Core</span><span class="subcaption">Elemental character</span></button>
<button class="choice" data-key="c" aria-pressed="false"><span class="stage"><span class="art" id="art-c"></span></span><span class="caption">C · Rhenium R</span><span class="subcaption">Distinctive initial</span></button>
</div>
<div class="preview stage" aria-label="Rhenium brand preview"><div class="art" id="large-art"></div><div><div class="wordmark">Rhenium</div><div class="tagline">A quieter web, made for TV.</div></div></div>
<div class="explanation"><strong id="chosen-name">A · Mint Orbit</strong><p id="suggestion">Recommended direction</p></div><p class="note" id="description" aria-live="polite"></p>
<div class="checks"><p>At 32px</p><div class="mini stage"><div class="art" id="mini-a"></div></div><div class="mini stage"><div class="art" id="mini-b"></div></div><div class="mini stage"><div class="art" id="mini-c"></div></div></div>
<p class="foot">Logo concepts for selection. Tap an option to compare it; Dark, Light and One color change the preview.</p>
<script>
const logos={"a": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" role=\"img\" aria-label=\"Rhenium Mint Orbit\"><title>Rhenium \u00b7 Mint Orbit</title><path fill=\"#DCEBDC\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 168.616 149.596 A 46 46 0 0 0 129.605 82.028 Z\" transform=\"rotate(0 128 128)\"/><path fill=\"#3D7B6B\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 168.616 149.596 A 46 46 0 0 0 129.605 82.028 Z\" transform=\"rotate(120 128 128)\"/><path fill=\"#80B5A0\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 168.616 149.596 A 46 46 0 0 0 129.605 82.028 Z\" transform=\"rotate(240 128 128)\"/><circle cx=\"128\" cy=\"128\" r=\"35\" fill=\"#19362E\"/></svg>", "b": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" role=\"img\" aria-label=\"Rhenium Silver Core\"><title>Rhenium \u00b7 Silver Core</title><path fill=\"#E0E5E4\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 172.218 140.679 A 46 46 0 0 0 120.012 82.699 Z\" transform=\"rotate(0 128 128)\"/><path fill=\"#334B46\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 172.218 140.679 A 46 46 0 0 0 120.012 82.699 Z\" transform=\"rotate(120 128 128)\"/><path fill=\"#829994\" d=\"M 39.803 72.888 A 104 104 0 0 1 216.197 72.888 L 172.218 140.679 A 46 46 0 0 0 120.012 82.699 Z\" transform=\"rotate(240 128 128)\"/><circle cx=\"128\" cy=\"128\" r=\"35\" fill=\"#A9D5BC\"/></svg>", "c": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" role=\"img\" aria-label=\"Rhenium Rhenium R\"><title>Rhenium \u00b7 Rhenium R</title><defs><mask id=\"r-cutout\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"256\" height=\"256\"><rect width=\"256\" height=\"256\" fill=\"white\"/><path d=\"M86 66H132C166 66 183 83 183 108C183 125 174 139 157 146L187 191H153L126 150H116V191H86Z M116 92V124H131C148 124 155 118 155 108C155 98 148 92 131 92Z\" fill=\"black\" fill-rule=\"evenodd\"/></mask></defs><g mask=\"url(#r-cutout)\"><path d=\"M128 128L37.933 76.000A104 104 0 0 1 218.067 76.000Z\" fill=\"#3D7B6B\"/><path d=\"M128 128L218.067 76.000A104 104 0 0 1 128.000 232.000Z\" fill=\"#DCEBDC\"/><path d=\"M128 128L128.000 232.000A104 104 0 0 1 37.933 76.000Z\" fill=\"#80B5A0\"/></g><path d=\"M116 92V124H131C148 124 155 118 155 108C155 98 148 92 131 92Z\" fill=\"#3D7B6B\"/></svg>"};
const details={a:{name:'A · Mint Orbit',text:'Three curved segments and a dark center. The circular browser silhouette uses our existing mint and forest colors.'},b:{name:'B · Silver Core',text:'Silver and slate segments surround a mint center. Straighter seams give it a more mechanical, metal-inspired character.'},c:{name:'C · Rhenium R',text:'A large R is cut into a segmented circle. The initial makes the mark easier to associate with Rhenium.'}};
function symbol(key,id){return logos[key].replaceAll('r-cutout','r-cutout-'+id)}
function choose(key){document.getElementById('large-art').innerHTML=symbol(key,'large');document.getElementById('chosen-name').textContent=details[key].name;document.getElementById('description').textContent=details[key].text;document.getElementById('suggestion').textContent=key==='a'?'Recommended direction':'';document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));}
for(const key of ['a','b','c']){document.getElementById('art-'+key).innerHTML=symbol(key,'choice-'+key);document.getElementById('mini-'+key).innerHTML=symbol(key,'mini-'+key)}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.key)));
for(const mode of ['dark','light'])document.getElementById(mode).addEventListener('click',()=>{document.body.classList.toggle('light',mode==='light');document.getElementById('light').setAttribute('aria-pressed',String(mode==='light'));document.getElementById('dark').setAttribute('aria-pressed',String(mode==='dark'))});
document.getElementById('mono').addEventListener('click',e=>{document.body.classList.toggle('mono');e.currentTarget.setAttribute('aria-pressed',String(document.body.classList.contains('mono')))});
choose('a');
requestAnimationFrame(()=>console.log(JSON.stringify({svgCount:document.querySelectorAll('svg').length,overflow:document.documentElement.scrollWidth>innerWidth,logoOptions:Object.keys(logos).length})));
</script></body></html>
