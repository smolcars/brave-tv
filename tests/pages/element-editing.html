<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV explicit editing fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 36px; background: #142726; color: #f3efe7;
    font: 22px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 32px; font-weight: 500; }
  p { margin: 0 0 20px; color: #d0dfd8; }
  form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  section { display: grid; gap: 14px; }
  button, input, textarea, [contenteditable] { width: 100%; height: 60px;
    padding: 12px 18px; border: 1px solid #647872; border-radius: 10px;
    background: #28413e; color: inherit; text-align: left; font: inherit; }
  input::placeholder, textarea::placeholder { color: #d0dfd8; opacity: 1; }
  :focus { outline: 2px solid #dcebdc; outline-offset: 3px; }
  output { display: block; margin-top: 20px; color: #d0dfd8; font-size: 16px; }
</style>
<h1>Choose a field, then press OK</h1>
<p>Arrows highlight. OK edits. Back closes the keyboard.</p>
<form id="form">
  <section>
    <button type="button" id="before" autofocus>Start here</button>
    <input id="field" aria-label="TV text field" placeholder="Text field">
    <input id="search" type="search" aria-label="TV search field" placeholder="Search field">
    <button type="button" id="after">After the fields</button>
  </section>
  <section>
    <button type="button" id="right">More field types</button>
    <textarea id="lines" aria-label="TV multiline field" placeholder="Multiline field"></textarea>
    <div id="rich" contenteditable="true" aria-label="TV rich text field">Rich text</div>
    <button type="button" id="end">After rich text</button>
  </section>
</form>
<output id="status" aria-live="polite">Waiting for focus</output>
<script>
  let edits = 0, submits = 0;
  function report() {
    document.querySelector('output').textContent =
      `Selected: ${document.activeElement.id} · Edits: ${edits} · Submits: ${submits}`;
  }
  document.addEventListener('focusin', report);
  document.addEventListener('input', () => { edits++; report(); });
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault(); submits++; report();
  });
</script>
</html>
