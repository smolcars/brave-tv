<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV native dialog checks</title>
<style>
  body { background: #111820; color: white; font: 24px sans-serif; padding: 32px; }
  button { font: inherit; padding: 18px; margin: 12px; }
  output { display: block; margin: 24px 12px; }
  #fileDetails { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>TV native dialog checks</h1>
<button id="alert">Alert</button>
<button id="confirm">Confirm</button>
<button id="prompt">Prompt</button>
<button id="popup">Popup</button>
<button id="location">Location permission</button>
<label>Choose a local file <input id="file" type="file"></label>
<label>Choose an image <input id="imageFile" type="file" accept="image/*"></label>
<a id="external" href="bravetv-unavailable://fixture">Open an unavailable external app</a>
<output id="result" aria-live="polite">No action yet</output>
<output id="fileDetails" aria-live="off"></output>
<script>
  const result = document.querySelector('#result');
  const cancels = {file: 0, imageFile: 0};
  const reportFiles = () => {
    document.querySelector('#fileDetails').textContent = 'File details: ' + JSON.stringify({
      documentTime: performance.timeOrigin,
      cancels,
      files: Object.fromEntries(['file', 'imageFile'].map(id => [id,
        Array.from(document.getElementById(id).files).slice(0, 2).map(file => ({
          name: file.name.slice(0, 128), size: file.size, type: file.type.slice(0, 128)
        }))]))
    });
  };
  for (const id of ['file', 'imageFile']) {
    document.getElementById(id).oncancel = () => {
      result.textContent = id === 'file' ? 'File choice canceled' : 'Image choice canceled';
      cancels[id]++;
      reportFiles();
    };
    document.getElementById(id).onchange = reportFiles;
  }
  reportFiles();
  document.querySelector('#alert').onclick = () => {
    alert('TV alert: close this dialog with the remote.');
    result.textContent = 'Alert closed';
  };
  document.querySelector('#confirm').onclick = () => {
    result.textContent = `Confirm: ${confirm('TV confirmation: accept or cancel.')}`;
  };
  document.querySelector('#prompt').onclick = () => {
    const text = prompt('TV prompt: edit or cancel.', 'Sample');
    result.textContent = text === null ? 'Prompt canceled' : `Prompt: ${text}`;
  };
  document.querySelector('#popup').onclick = () => {
    result.textContent = window.open('bookmark.html?popup', '_blank')
      ? 'Popup opened' : 'Popup blocked';
  };
  document.querySelector('#location').onclick = () => {
    navigator.geolocation.getCurrentPosition(
      () => { result.textContent = 'Location allowed'; },
      error => { result.textContent = `Location error: ${error.code}`; },
      { timeout: 5000 }
    );
  };
</script>
</html>
